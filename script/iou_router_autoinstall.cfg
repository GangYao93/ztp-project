!
! DHCP option 67 must point to this IOS configuration file.
! AutoInstall applies configuration files; it does not execute Tcl files.
!
interface Ethernet0/0
 ip address dhcp
 no shutdown
!
event manager applet INSTALL-IOU-ROUTER-ZTP authorization bypass
 event timer countdown time 15 maxrun 300
 action 1.0 syslog msg "IOU-ROUTER-ZTP: running Tcl bootstrap from TFTP"
 action 2.0 cli command "enable"
 action 3.0 cli command "tclsh tftp://10.10.0.2/iou_router_ztp.tcl"
!
